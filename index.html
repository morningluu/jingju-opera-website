<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="国粹·京剧——京剧艺术文化主题静态网站，展示京剧发展历程、四大行当、声腔体系、脸谱艺术与舞台美术。">
  <title>国粹 · 京剧｜京剧艺术文化网站</title>
  <style>
    :root {
      --ink: #1a0808;
      --red: #8f1d1d;
      --red-bright: #c7352b;
      --gold: #d8b56a;
      --gold-soft: #efdcae;
      --paper: #f4ead8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px;
      color: var(--paper);
      background:
        radial-gradient(circle at 20% 15%, rgba(199, 53, 43, .24), transparent 34%),
        radial-gradient(circle at 82% 78%, rgba(216, 181, 106, .12), transparent 38%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, transparent 1px 9px),
        var(--ink);
      font-family: "Songti SC", "Noto Serif SC", "SimSun", Georgia, serif;
      overflow-x: hidden;
    }
    .frame {
      position: relative;
      width: min(940px, 100%);
      padding: clamp(34px, 7vw, 82px) clamp(24px, 7vw, 92px);
      border: 1px solid rgba(216, 181, 106, .48);
      box-shadow: 0 35px 90px rgba(0, 0, 0, .45), inset 0 0 80px rgba(143, 29, 29, .12);
      text-align: center;
      background: linear-gradient(160deg, rgba(143, 29, 29, .12), transparent 40%, rgba(216, 181, 106, .04));
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 58px;
      height: 58px;
      border-color: var(--gold);
      border-style: solid;
      opacity: .85;
    }
    .frame::before { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
    .frame::after { right: 10px; bottom: 10px; border-width: 0 1px 1px 0; }
    .seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      margin-bottom: 26px;
      border: 1px solid var(--red-bright);
      color: var(--red-bright);
      font-size: 25px;
      line-height: 1;
      letter-spacing: 0;
      box-shadow: 0 0 0 5px rgba(199, 53, 43, .08);
    }
    .kicker {
      margin: 0 0 16px;
      color: var(--gold);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .42em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(52px, 11vw, 108px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .1em;
      text-indent: .1em;
      color: var(--paper);
      text-shadow: 0 2px 30px rgba(199, 53, 43, .28);
    }
    h1 span { color: var(--gold); }
    .en {
      margin: 22px 0 0;
      color: rgba(244, 234, 216, .56);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(12px, 1.6vw, 15px);
      letter-spacing: .34em;
      text-indent: .34em;
    }
    .rule {
      width: 76px;
      height: 1px;
      margin: 32px auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .75;
    }
    .intro {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(244, 234, 216, .76);
      font-size: 15px;
      line-height: 2;
      letter-spacing: .06em;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 24px;
      margin: 30px 0 38px;
      color: rgba(216, 181, 106, .84);
      font-size: 12px;
      letter-spacing: .16em;
    }
    .meta span { display: inline-flex; align-items: center; gap: 8px; }
    .meta span::before {
      content: "";
      width: 4px;
      height: 4px;
      background: var(--red-bright);
      transform: rotate(45deg);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-width: 210px;
      padding: 16px 30px;
      border: 1px solid var(--gold);
      color: var(--gold-soft);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: .28em;
      text-indent: .28em;
      transition: background .25s ease, color .25s ease, transform .25s ease;
    }
    .enter:hover, .enter:focus-visible {
      background: var(--gold);
      color: var(--ink);
      transform: translateY(-2px);
      outline: none;
    }
    .enter.ghost {
      border-color: rgba(216, 181, 106, .3);
      color: rgba(244, 234, 216, .58);
    }
    .enter.ghost:hover, .enter.ghost:focus-visible {
      border-color: var(--gold);
      background: rgba(216, 181, 106, .1);
      color: var(--gold-soft);
    }
    .enter i { font-style: normal; font-size: 18px; letter-spacing: 0; text-indent: 0; }
    .hint {
      margin: 26px 0 0;
      color: rgba(244, 234, 216, .36);
      font-size: 11px;
      letter-spacing: .08em;
    }
    .foot {
      margin-top: 30px;
      color: rgba(244, 234, 216, .3);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .frame { padding: 42px 20px 36px; }
      .intro { font-size: 14px; }
      .meta { gap: 8px 16px; font-size: 11px; }
      .enter { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .enter { transition: none; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="seal" aria-hidden="true">京</div>
    <p class="kicker">Graduation Project · Peking Opera</p>
    <h1>国粹<span>·</span>京剧</h1>
    <p class="en">THE ART OF PEKING OPERA</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="intro">生旦净丑，唱念做打。以数字页面重访京剧三百年舞台，在行当、声腔、脸谱与舞台美术之间，看见一门东方表演艺术的秩序与光彩。</p>
    <div class="meta">
      <span>十二个主题页面</span>
      <span>图像切片版式</span>
      <span>桌面端浏览</span>
    </div>
    <div class="actions">
      <a class="enter" href="首页/首页/首页.html">进入网站 <i>→</i></a>
      <a class="enter ghost" href="pages.html">全部页面</a>
    </div>
    <p class="hint">原作为 1921px 固定宽度设计，建议使用桌面端全屏浏览</p>
    <p class="foot">Designed &amp; built with Claude Code</p>
  </main>
</body>
</html>
